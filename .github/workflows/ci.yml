# GitHub Actions: on every push / pull request, GitHub starts fresh Linux machines
# and runs these steps. A green check on GitHub = everything below passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven            # reuse downloaded libraries between runs

      - name: Install Stockfish (used by the engine tests)
        run: sudo apt-get update && sudo apt-get install -y stockfish

      # Includes AppIntegrationTest: Testcontainers starts Postgres using the runner's Docker.
      - name: Run tests
        run: mvn -B test

  frontend:
    name: React build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npx oxlint src
      - name: Type-check and build
        run: npm run build
